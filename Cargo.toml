[package]
name = "rtest"
version = "0.0.46"
edition = "2021"
rust-version = "1.97"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
glob = "0.3.4"
log = "0.4.34"
num_cpus = "1.17.0"
pyo3 = { version = "0.29.3", optional = true }
regex = "1.13.1"
ruff_python_ast = { path = "ruff/crates/ruff_python_ast" }
ruff_python_parser = { path = "ruff/crates/ruff_python_parser" }
ruff_python_stdlib = { path = "ruff/crates/ruff_python_stdlib" }
ruff_text_size = { path = "ruff/crates/ruff_text_size" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
toml = "1.1.8"
walkdir = "2.5.0"

[dev-dependencies]
indoc = "2.0.8"
