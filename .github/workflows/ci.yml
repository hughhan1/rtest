name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04, windows-2022]
        # TODO(hughhan1): Add macOS runners back when budget allows
        # macos-13, macos-14 - currently disabled due to cost
        # As of July 2025, macOS runners cost 10x more than Linux runners
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache Rust dependencies
      uses: actions/cache@v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-${{ matrix.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

    - name: Create virtual environment
      run: python -m venv .venv

    - name: Install dependencies in virtual environment
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          .venv\\Scripts\\python -m pip install --upgrade pip
          .venv\\Scripts\\pip install maturin pytest==9.1.1
        else
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install maturin[patchelf] pytest==9.1.1
        fi
      shell: bash

    - name: Install rtest with maturin develop
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          .venv\\Scripts\\maturin develop --release
        else
          .venv/bin/maturin develop --release
        fi
      shell: bash

    - name: Run Rust unit tests
      run: cargo test --lib

    - name: Run Rust integration tests
      run: cargo test

    - name: Test import
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          .venv\\Scripts\\python -c "import rtest; print('Import successful')"
        else
          .venv/bin/python -c "import rtest; print('Import successful')"
        fi
      shell: bash

    - name: Run Python integration tests
      run: |
        if [ "${{ runner.os }}" = "Windows" ]; then
          .venv\\Scripts\\rtest tests/ --runner native -n 1
        else
          .venv/bin/rtest tests/ --runner native -n 1
        fi
      shell: bash

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0

    - name: Run ruff format check
      run: uv run ruff format --check python/ tests/ scripts/

    - name: Run ruff lint
      run: uv run ruff check python/ tests/ scripts/

    - name: Run ty
      run: uv run ty check python/ tests/ scripts/

    - name: Run vulture (dead code detection)
      run: uv run vulture python/ tests/ scripts/ --min-confidence 80

    - name: Check Rust formatting
      run: cargo fmt -- --check

    - name: Run clippy
      run: cargo clippy -p rtest --lib -- -D warnings

  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: true

    - name: Set up Python
      uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.14'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0

    - name: Install hyperfine
      uses: taiki-e/install-action@v2
      with:
        tool: hyperfine@1.20.0

    - name: Build release rtest
      run: |
        uv sync --locked --no-install-project
        uv run --no-sync maturin develop --release

    - name: Benchmark static collection
      run: uv run --no-sync python scripts/benchmark/benchmark_repositories.py

    - name: Publish benchmark summary
      run: cat dist/benchmarks/summary.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload benchmark reports
      if: always()
      uses: actions/upload-artifact@v7.0.2
      with:
        name: benchmark-results
        path: dist/benchmarks/
        if-no-files-found: error
        retention-days: 7
